server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Note the absence of a trailing path on proxy_pass: nginx then forwards the
    # URI unchanged, so /api/urls reaches the backend as /api/urls. Writing
    # `proxy_pass http://api:4000/;` would strip the /api prefix and every route
    # would 404, since the backend mounts everything under /api.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass a correlation id through if the client supplied one; the API mints
        # one otherwise and echoes it back.
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Client-side routes (/urls/:id, /admin/metrics) have no file on disk, so
    # anything that is not a real asset falls back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
