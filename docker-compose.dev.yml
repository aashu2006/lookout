# Host-development override: publishes Postgres and Redis so `npm run dev` in
# backend/ and frontend/ can reach them on localhost. The app containers are not
# needed for this flow.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
